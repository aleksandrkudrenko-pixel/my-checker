name: Auto Proxy Checker
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-proxies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Filter Nodes
        run: |
          mkdir -p output
          # Скачиваем рабочий пул
          curl -sL "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt" -o raw_nodes.txt
          
          # Фильтруем VLESS и Hysteria напрямую через поиск строк (так быстрее и без ошибок)
          grep -E "^vless://" raw_nodes.txt | tail -n 50 > output/vless.txt || echo "" > output/vless.txt
          grep -E "^(hy2|hysteria2)://" raw_nodes.txt | tail -n 50 > output/hysteria2.txt || echo "" > output/hysteria2.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add output/
          git commit -m "Update working nodes" || exit 0
          git push origin main
