name: Auto VPN Subscription

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  build-subscription:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build subscriptions
        run: |
          mkdir -p output

          rm -f all.txt clean.txt

          echo "Downloading sources..."

          curl -L "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" >> all.txt
          echo "" >> all.txt

          curl -L "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" >> all.txt
          echo "" >> all.txt

          curl -L "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt" >> all.txt
          echo "" >> all.txt

          curl -L "https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt" >> all.txt
          echo "" >> all.txt

          curl -L "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/26.txt" >> all.txt
          echo "" >> all.txt

          echo "Downloading aggregator..."

          curl -L "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt" -o base64.txt

          cat base64.txt | base64 -d >> all.txt || true

          echo "Filtering and removing duplicates..."

          grep -E "^(vless|hy2|hysteria2|hysteria)://" all.txt | sort -u > clean.txt

          echo "Creating VLESS files..."

          grep "^vless://" clean.txt | shuf > vless_all.txt

          split -n l/3 vless_all.txt vless_part_

          mv vless_part_aa output/vless1.txt
          mv vless_part_ab output/vless2.txt
          mv vless_part_ac output/vless3.txt

          echo "Creating Hysteria file..."

          grep -E "^(hy2|hysteria2|hysteria)://" clean.txt | shuf | head -n 300 > output/hysteria.txt || true

          echo "Done"

          echo "VLESS1:"
          wc -l output/vless1.txt || true

          echo "VLESS2:"
          wc -l output/vless2.txt || true

          echo "VLESS3:"
          wc -l output/vless3.txt || true

          echo "HYSTERIA:"
          wc -l output/hysteria.txt || true

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add output/

          git commit -m "Auto update subscriptions" || exit 0

          git push
