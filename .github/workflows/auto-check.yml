name: Auto VPN Subscription

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build subscriptions
        run: |
          mkdir -p output

          download_igareck() {
            local file="$1"
            local urls="
          https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/${file}
          https://raw.githack.com/igareck/vpn-configs-for-russia/main/${file}
          https://gitlab.com/igareck/vpn-configs-for-russia/-/raw/main/${file}
          https://codeberg.org/igareck/vpn-configs-for-russia/raw/branch/main/${file}
          https://gitea.com/igareck/vpn-configs-for-russia/raw/branch/main/${file}
          https://bitbucket.org/igareck/vpn-configs-for-russia/raw/main/${file}"
            for url in $urls; do
              result=$(curl -sL --connect-timeout 5 --max-time 10 "$url" 2>/dev/null)
              if [ -n "$result" ] && [ ${#result} -gt 50 ]; then
                echo "$result"
                return 0
              fi
            done
            return 1
          }

          download() {
            local url="$1"
            local result=""
            result=$(curl -sL --connect-timeout 5 --max-time 10 "$url" 2>/dev/null)
            if [ -n "$result" ] && [ ${#result} -gt 50 ]; then
              echo "$result"
              return 0
            fi
            local githack=$(echo "$url" | sed 's|raw.githubusercontent.com|raw.githack.com|' | sed 's|github.com/.*/raw/|raw.githack.com/|')
            result=$(curl -sL --connect-timeout 5 --max-time 10 "$githack" 2>/dev/null)
            if [ -n "$result" ] && [ ${#result} -gt 50 ]; then
              echo "$result"
              return 0
            fi
            return 1
          }

          echo "Скачиваю igareck WHITE..."
          download_igareck "WHITE-SNI-RU-all.txt" > raw_igareck_white.txt
          download_igareck "WHITE-CIDR-RU-all.txt" >> raw_igareck_white.txt
          download_igareck "Vless-Reality-White-Lists-Rus-Mobile.txt" >> raw_igareck_white.txt

          echo "Скачиваю igareck BLACK..."
          download_igareck "BLACK_VLESS_RUS.txt" > raw_igareck_black.txt
          download_igareck "BLACK_VLESS_RUS_mobile.txt" >> raw_igareck_black.txt

          echo "Скачиваю zieng2..."
          download "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt" > raw_zieng2.txt

          echo "Скачиваю AvenCores..."
          download "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/26.txt" > raw_avencore.txt

          echo "Скачиваю lm705 alive..."
          download "https://raw.githubusercontent.com/lm705/vair/main/vless_alive.txt" > raw_lm705.txt

          echo "Скачиваю luxxuria..."
          download "https://raw.githubusercontent.com/luxxuria/harvester/main/ping_tested.txt" > raw_luxxuria_ping.txt
          download "https://raw.githubusercontent.com/luxxuria/harvester/main/speed_tested.txt" > raw_luxxuria_speed.txt
          download "https://raw.githubusercontent.com/luxxuria/harvester/main/top_600.txt" > raw_luxxuria_top.txt

          echo "Фильтрация..."

          grep "^vless://" raw_igareck_white.txt 2>/dev/null | grep -v "@127\.0\.0\.1" | grep -v "@\[::1\]" | grep -v "@localhost" | sort -u | shuf | head -n 300 > output/igareck_white.txt || true

          grep "^vless://" raw_igareck_black.txt 2>/dev/null | grep -v "@127\.0\.0\.1" | grep -v "@\[::1\]" | grep -v "@localhost" | sort -u | shuf | head -n 300 > output/igareck_black.txt || true

          grep "^vless://" raw_zieng2.txt 2>/dev/null | grep -v "@127\.0\.0\.1" | grep -v "@\[::1\]" | grep -v "@localhost" | sort -u | shuf > output/zieng2.txt || true

          cat raw_igareck_white.txt raw_igareck_black.txt raw_avencore.txt 2>/dev/null | grep "^trojan://" | sort -u | head -n 300 > output/trojan.txt || true

          cat raw_igareck_white.txt raw_igareck_black.txt 2>/dev/null | grep "^ss://" | sort -u > tmp_ss_ig.txt || true
          grep "^ss://" raw_avencore.txt 2>/dev/null | sort -u > tmp_ss_av.txt || true
          cat tmp_ss_ig.txt tmp_ss_av.txt 2>/dev/null | awk '!seen[$0]++' | head -n 300 > output/shadowsocks.txt || true

          grep "^vless://" raw_avencore.txt 2>/dev/null | grep -v "@127\.0\.0\.1" | grep -v "@\[::1\]" | grep -v "@localhost" | sort -u | shuf > tmp_avencore_all.txt || true
          head -n 900 tmp_avencore_all.txt > output/avencore1.txt 2>/dev/null || true
          tail -n +901 tmp_avencore_all.txt | head -n 900 > output/avencore2.txt 2>/dev/null || true

          grep "^vless://" raw_lm705.txt 2>/dev/null | sort -u | shuf > output/lm705.txt || true

          grep "^vless://" raw_luxxuria_ping.txt 2>/dev/null | sort -u | shuf > output/luxxuria_ping.txt || true
          grep "^vless://" raw_luxxuria_speed.txt 2>/dev/null | sort -u | shuf > output/luxxuria_speed.txt || true
          grep "^vless://" raw_luxxuria_top.txt 2>/dev/null | sort -u | shuf > output/luxxuria_top.txt || true

          cat output/igareck_white.txt output/igareck_black.txt output/trojan.txt output/shadowsocks.txt output/zieng2.txt output/avencore1.txt output/avencore2.txt output/lm705.txt output/luxxuria_ping.txt output/luxxuria_speed.txt output/luxxuria_top.txt 2>/dev/null | shuf > output/all.txt

          date > output/updated.txt
          rm -f raw_*.txt tmp_*.txt

          echo "--- Результат ---"
          for f in output/*.txt; do echo "$(basename $f): $(wc -l < $f)"; done

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "[jg:email_19]"
          git add output/
          git commit -m "Auto update $(date '+%Y-%m-%d %H:%M')" || exit 0
          git push

      - name: Mirror to Codeberg
        run: |
          git remote add codeberg https://prizrak1984:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/prizrak1984/my-checker.git 2>/dev/null || true
          git push codeberg main --force 2>/dev/null || echo "Codeberg push failed"
