name: Auto Proxy Checker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-subscription:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Build Subscription
        run: |
          mkdir -p output

          echo "Downloading nodes..."

          curl -L "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt" -o sub.txt

          # Пробуем декодировать base64
          base64 -d sub.txt > decoded.txt 2>/dev/null || cp sub.txt decoded.txt

          echo "Filtering VLESS..."
          grep "^vless://" decoded.txt | tail -n 100 > output/vless.txt || true

          echo "Filtering Hysteria2..."
          grep -E "^(hy2|hysteria2|hysteria)://" decoded.txt | tail -n 100 > output/hysteria2.txt || true

          # Общий файл подписки
          cat output/vless.txt output/hysteria2.txt > output/subscription.txt

          echo "Done"

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add output/

          git commit -m "Auto update subscription" || exit 0

          git push
