name: Auto Proxy Checker
on:
  schedule:
    - cron: '*/30 * * * *' # Запуск автоматически каждые 30 минут
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  check-proxies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Filter Nodes
        run: |
          mkdir -p output
          # Скачиваем тот самый рабочий пул, который у вас завелся
          curl -sL "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt" > raw_nodes.txt
          
          # Очищаем старые файлы перед записью
          > output/vless.txt
          > output/hysteria2.txt
          
          # Робот сам перебирает базу и раскладывает серверы по двум файлам
          while IFS= read -r line || [ -n "$line" ]; do
            # Убираем пробелы и пустые строки
            line=$(echo "$line" | xargs)
            if [[ "$line" == vless://* ]]; then
              echo "$line" >> output/vless.txt
            elif [[ "$line" == hy2://* || "$line" == hysteria2://* ]]; then
              echo "$line" >> output/hysteria2.txt
            fi
          done < raw_nodes.txt
          
          # Оставляем топ-60 свежих серверов каждого типа, чтобы Happ работал быстро
          if [ -s output/vless.txt ]; then
            tail -n 60 output/vless.txt > tmp_v.txt && mv tmp_v.txt output/vless.txt
          fi
          if [ -s output/hysteria2.txt ]; then
            tail -n 60 output/hysteria2.txt > tmp_h.txt && mv tmp_h.txt output/hysteria2.txt
          fi

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add output/
          git commit -m "Update working nodes" || exit 0
          git push
