name: Auto Proxy Checker
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-proxies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Filter Nodes
        run: |
          mkdir -p output
          
          # Скачиваем стабильный и легкий агрегатор (разбитый по протоколам)
          curl -sL "https://raw.githubusercontent.com/alswl/v2ray-share/master/vless" -o vless_raw.txt
          curl -sL "https://raw.githubusercontent.com/alswl/v2ray-share/master/hysteria2" -o hy2_raw.txt
          
          # Если скачалось успешно, берем свежие 60 серверов, иначе оставляем пустым
          [ -s vless_raw.txt ] && tail -n 60 vless_raw.txt > output/vless.txt || echo "" > output/vless.txt
          [ -s hy2_raw.txt ] && tail -n 60 hy2_raw.txt > output/hysteria2.txt || echo "" > output/hysteria2.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add output/
          git commit -m "Update working nodes" || exit 0
          git push origin main
