# ============================================================
# CLASH META (MIHOMO) — ОПТИМИЗИРОВАННЫЙ РФ-КОНФИГ v9
# Две авто-группы / Защита батареи / Фикс затыков
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: silent
ipv6: false

# --- Энергосберегающее ускорение сети ---
tcp-concurrent: true
unified-delay: true
keep-alive-idle: 30              # Увеличено, чтобы реже будить процессор
keep-alive-interval: 30

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]

# ============================================================
# DNS — Защита от утечек + Прямой роутинг Telegram
# ============================================================
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '+.telegram.org'
    - '+.telegram.me'
    - '+.t.me'
    - '+.tdesktop.com'
    - '+.telegra.ph'
    - '+.telega.one'
    - '+.yandex.ru'
    - '+.yandex.net'
    - '+.ya.ru'
    - '+.mail.ru'
    - '+.vk.com'
    - '+.sberbank.ru'
    - '+.tinkoff.ru'
    - '+.gosuslugi.ru'
    - '+.mos.ru'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - https://8.8.4.4/dns-query
  fallback-filter:
    geoip: true
    geoip-code: RU

# ============================================================
# PROXY PROVIDERS — Энергосберегающий режим (lazy: true здесь)
# ============================================================
