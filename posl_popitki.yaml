# ============================================================
# PROXY GROUPS — Разделение на два сбалансированных автомата
# ============================================================
proxy-groups:

  # Главный тумблер управления трафиком
  - name: "🚀 PROXY"
    type: select
    proxies:
      - "🎯 ГЛАВНЫЙ АВТОМАТ"
      - "📊 ГРУППА 1: СКОРОСТЬ"
      - "🔒 ГРУППА 2: РФ-ОБХОД"
      - "✋ РУЧНОЙ ВЫБОР"
      - DIRECT

  # Каскадный автомат: выбирает лучшую из двух уже протестированных групп
  - name: "🎯 ГЛАВНЫЙ АВТОМАТ"
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 120                 # Увеличено до 2 минут ради батареи
    tolerance: 30
    lazy: false                  # Оставляем false только тут, чтобы переключение было мгновенным
    proxies:
      - "📊 ГРУППА 1: СКОРОСТЬ"
      - "🔒 ГРУППА 2: РФ-ОБХОД"

  # Подгруппа 1: Глобальные быстрые листы
  - name: "📊 ГРУППА 1: СКОРОСТЬ"
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 180                 # Редкий опрос (раз в 3 минуты) экономит заряд
    tolerance: 40
    lazy: true
    use:
      - speed
      - ping
      - alive
      - top600
      - zieng

  # Подгруппа 2: Специализированные Reality листы под РФ
  - name: "🔒 ГРУППА 2: РФ-ОБХОД"
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 180
    tolerance: 40
    lazy: true
    use:
      - reality-sni
      - reality-cidr
      - reality-mobile
      - igareck-black
      - igareck-mobile
      - avencores

  # Полный список всех серверов для ручного контроля
  - name: "✋ РУЧНОЙ ВЫБОР"
    type: select
    use:
      - speed
      - ping
      - alive
      - top600
      - zieng
      - reality-sni
      - reality-cidr
      - reality-mobile
     # - igareck-black
    #  - igareck-mobile
     # - avencores

# ============================================================
